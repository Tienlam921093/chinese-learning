# Production self-hosting. Set DATABASE_URL in secrets/backend.env to a managed
# PostgreSQL database (such as Neon); this compose file intentionally runs no DB.
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./secrets/backend.env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    networks: [hanyu-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    networks: [hanyu-network]

networks:
  hanyu-network:
