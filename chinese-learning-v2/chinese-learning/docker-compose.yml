services:
  postgres:
    image: postgres:16-alpine
    container_name: hanyu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hanyudb
      POSTGRES_USER: hanyu_app
      POSTGRES_PASSWORD: hanyu_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres-init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [hanyu-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanyu_app -d hanyudb"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: hanyu-backend
    restart: unless-stopped
    env_file: ./secrets/backend.env
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hanyudb
      DB_USER: hanyu_app
      DB_PASSWORD: hanyu_local_password
      PGSSLMODE: disable
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks: [hanyu-network]

  frontend:
    image: nginx:alpine
    container_name: hanyu-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    networks: [hanyu-network]

volumes:
  postgres_data:

networks:
  hanyu-network:
