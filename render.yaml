services:
  - type: web
    name: hanyu-api
    runtime: docker
    repo: https://github.com/Tienlam921093/chinese-learning.git
    branch: main
    dockerfilePath: ./Dockerfile.railway
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        fromService:
          name: hanyu-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_URL
        fromService:
          name: hanyu-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        sync: false
